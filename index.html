<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROCK-PAPER-SCISSORS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Rock-Paper-Scissors</h1>
    </header>
    <main>
      <div class="choices">
        <img class="choice" id="rock" src="./assets/rock.png" alt="Rock" />
        <img class="choice" id="paper" src="./assets/paper.png" alt="Paper" />
        <img class="choice" id="scissors" src="./assets/scissors.png" alt="scissors" />
      </div>
      <div class="scoreBoard">
        <div class="score">
          <p id="userScore">0</p>
          <p>Player</p>
        </div>
        <div class="score">
          <p id="computerScore">0</p>
          <p>Computer</p>
        </div>
      </div>

      <div class="msgContainer">
        <p id="msg">PLay Your Move!</p>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
